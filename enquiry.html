<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khanyisa's Artisan Bakery - Enquiry</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Khanyisa's Artisan Bakery</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="product.html">Products</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="enquiry-form">
            <h2>Place an Enquiry or Custom Order</h2>
            <p>Fill out the form below to request a custom cake or send us a question about our menu.</p>
            
            <form action="#" method="POST">
                <label for="name">Full Name:</label><br>
                <input type="text" id="name" name="name" required><br><br>

                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="order-type">Enquiry Type:</label><br>
                <select id="order-type" name="order_type">
                    <option value="custom-cake">Custom Celebration Cake</option>
                    <option value="daily-menu">Daily Menu Question</option>
                    <option value="event-catering">Event Catering</option>
                </select><br><br>

                <label for="message">Message / Details:</label><br>
                <textarea id="message" name="message" rows="5" required></textarea><br><br>

                <button type="submit" class="btn">Submit Enquiry</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Khanyisa's Artisan Bakery. All rights reserved.</p>
    </footer>
</body>
</html>
