<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquire Online | Khanyisa's Artisan Bakery</title>
    <meta name="description" content="Send your product, pricing, or custom order enquiries to Khanyisa's Artisan Bakery. We are here to help make your events special.">
    <meta name="keywords" content="bakery enquiry, custom order, catering query, price quote bakery">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">Khanyisa's Artisan Bakery</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="product.html">Products</a></li>
                <li><a href="enquiry.html" class="active">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="enquiry-form">
            <h2>Place an Enquiry or Custom Order</h2>
            <p>Fill out the form below to request a custom cake or send us a question about our menu and pricing.</p>

            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="order-type">Enquiry Type:</label>
                    <select id="order-type" name="order_type">
                        <option value="custom-cake">Custom Celebration Cake</option>
                        <option value="daily-menu">Daily Menu Question</option>
                        <option value="event-catering">Event Catering</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="details">Enquiry Details:</label>
                    <textarea id="details" name="details" rows="4" required placeholder="Describe what you need..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Submit Enquiry</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Khanyisa's Artisan Bakery. All rights reserved.</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
