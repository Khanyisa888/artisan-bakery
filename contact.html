<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Khanyisa's Artisan Bakery</title>
    <meta name="description" content="Get in touch with Khanyisa's Artisan Bakery for general queries, custom orders, customer feedback, and delicious handcrafted baked goods.">
    <meta name="keywords" content="contact bakery, bakery location, customer support, artisan bakery Pretoria">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">Khanyisa's Artisan Bakery</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="product.html">Products</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-section">
            <h2>Contact Us</h2>
            <p>We would love to hear from you. Get in touch with our team for questions or support.</p>

            <form action="#" method="POST">
                <div class="form-group">
                    <label for="contact-name">Full Name:</label>
                    <input type="text" id="contact-name" name="name" required placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="contact-email">Email Address:</label>
                    <input type="email" id="contact-email" name="email" required placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="subject">Subject:</label>
                    <select id="subject" name="subject">
                        <option value="general">General Query</option>
                        <option value="feedback">Customer Feedback</option>
                        <option value="support">Support / Order Issue</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Your Message:</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Type your message here..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Khanyisa's Artisan Bakery. All rights reserved.</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
